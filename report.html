<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Incident</title>
</head>

<body>

    <h1>Report a Security Incident</h1>

    <hr>

    index.htmlHome</a> |
    report.htmlReport Incident</a> |
    incidents.htmlIncident Types</a> |
    tips.htmlSecurity Tips</a> |
    contact.htmlContact</a>

    <hr>

    <p>
        Use this form to report any cybersecurity incident.
    </p>

    <form>

        <label>Full Name:</label><br>
        <input type="text"><br><br>

        <label>Email Address:</label><br>
        <input type="email"><br><br>

        <label>Incident Type:</label><br>
        <select>
            <option>Phishing</option>
            <option>Malware</option>
            <option>Unauthorized Access</option>
            <option>Data Breach</option>
        </select>

        <br><br>

        <label>Severity Level:</label><br>

        <input type="radio" name="severity"> Low
        <input type="radio" name="severity"> Medium
        <input type="radio" name="severity"> High
        <input type="radio" name="severity"> Critical

        <br><br>

        <label>Incident Description:</label><br>

        <textarea rows="6" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Submit Report">

    </form>

    <br>

    index.htmlBack to Home</a>

</body>

</html>
